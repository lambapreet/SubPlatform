{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edenthought</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>

    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/lux/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light justify-content-center">
        <a class="navbar-brand main-heading">&nbsp; Edenthought</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"   <!-- ✅ Bootstrap 5 uses data-bs-* -->
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse text-center" id="navbarNavDropdown">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-secondary navbar-btn" href="{% url 'register' %}">Register</a>
                </li>

                <li class="nav-item ms-3">
                    <a class="btn btn-secondary navbar-btn" href="{% url 'login' %}">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container text-center mt-5">
        <h5>Edenthought... Subscribe for the most informative articles on the net!</h5>
        <br>
        <p>Browse through our extensive collection of carefully curated content.</p>
        <br>
        <a class="btn btn-success" href="{% url 'register' %}">
            <i class="fa fa-angle-right" aria-hidden="true"></i> &nbsp; Get started today
        </a>
    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76A2z02tPqdjfd0nDdK1EwVnRjE4p3gi3z5kRxpP6m5e6z5F1RTF+6tzt4tF7iD"
            crossorigin="anonymous"></script>
</body>
</html>
