{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap Theme -->
    <link rel="stylesheet" href="https://bootswatch.com/5/lux/bootstrap.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <title>Edenthought | Writer</title>
    
    <style>
        /* Extra Styling */
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d6efd !important;
        }
        .navbar-nav .nav-item {
            margin-left: 10px;
        }
        .navbar-btn {
            border-radius: 25px;
            padding: 6px 15px;
            font-size: 0.95rem;
        }
        .content-wrapper {
            margin: 30px auto;
            max-width: 1100px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand">Edenthought</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse text-center" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="btn btn-outline-primary navbar-btn" href="{% url '' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-primary navbar-btn" href="{% url '' %}">Create Article</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-primary navbar-btn" href="{% url '' %}">Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-primary navbar-btn" href="{% url '' %}">Account</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-danger navbar-btn" href="{% url '' %}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Block -->
    <div class="content-wrapper">
        {% block content %}{% endblock content %}
    </div>

    <!-- Bootstrap JS (for navbar toggler) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
