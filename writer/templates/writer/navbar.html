{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://bootswatch.com/5/lux/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Edenthought | Writer</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light justify-content-center">
        <a class="navbar-brand main-heading"> 
            &nbsp; Edenthought 
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse text-center" id="navbarNavDropdown">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-secondary navbar-btn" href="{% url 'writer-dashboard' %}">Dashboard</a>
                </li>

                {% comment %} <li class="nav-item">
                    <a class="btn btn-secondary navbar-btn" href="{% url '' %}">Create Article</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-secondary navbar-btn" href="{% url '' %}">Articles</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-secondary navbar-btn" href="{% url '' %}">Account Management</a>
                </li> {% endcomment %}

                <li class="nav-item">
                    <a class="btn btn-secondary navbar-btn" href="{% url 'logout' %}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    {% block content %}{% endblock content %}
</body>
</html>
