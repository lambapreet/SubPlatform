{% extends "writer/navbar.html" %}

{% load crispy_forms_tags %}

{% block content %}
    <div class="container bg-white shadow-md p-5 form-layour">
        <h2>Update Account</h2>
        <p>You may Update your account details below: </p>
        <br>
        <form action="" method="POST" autocomplete="off">
            {% csrf_token %}
            {{UpdateUserForm | crispy}}

            <button class="btn btn-success" type="submit">Update Account</button>
        </form>
    </div>


    <div class="container bg-white shadow-md p-5 form-layour">
        <h2>Account Deletion</h2>
        <a href="{% url 'delete-account' %}" >Delete Account</a>
    </div>
{% endblock content %}
